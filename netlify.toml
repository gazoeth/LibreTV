# netlify.toml

[build]
  # 如果你的项目不需要构建步骤 (纯静态 + functions)，可以省略 publish
  # publish = "." # 假设你的 HTML/CSS/JS 文件在根目录
  functions = "netlify/functions" # 指定 Netlify 函数目录

# 配置 Edge Functions
[[edge_functions]]
  function = "inject-env"
  path = "/*"

# 配置重写规则，将 /proxy/* 的请求路由到 proxy 函数
# 这样前端的 PROXY_URL 仍然可以是 '/proxy/'
[[redirects]]
  from = "/proxy/*"
  to = "/.netlify/functions/proxy/:splat" # 将路径参数传递给函数
  status = 200 # 重要：这是代理，不是重定向

# 处理搜索路径格式 /s=*
[[redirects]]
  from = "/s=*"
  to = "/index.html"
  status = 200

# 搜索结果和播放跳转页不进入索引，避免参数化低质量页面占用抓取预算
[[headers]]
for = "/s=*"
  [headers.values]
  X-Robots-Tag = "noindex, follow"

[[headers]]
for = "/player.html"
  [headers.values]
  X-Robots-Tag = "noindex, follow, noarchive"

[[headers]]
for = "/watch.html"
  [headers.values]
  X-Robots-Tag = "noindex, follow, noarchive"

[[headers]]
for = "/sitemap.xml"
  [headers.values]
  Content-Type = "application/xml; charset=utf-8"
  Cache-Control = "public, max-age=3600"
